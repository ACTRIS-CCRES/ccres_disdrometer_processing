[build-system]
requires = ["setuptools", "numpy"]
build-backend = "setuptools.build_meta"

[project]
authors = [
    { name = "ACTRIS-CCRES", email = "ccres-dev@listes.ipsl.fr" },
    { name = "Julien Delanoë" },
    { name = "Susana Jorquera" },
]
name = "ccres_disdrometer_processing"
description = "CCRES code to convert data"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    'Development Status :: 2 - Pre-Alpha',
    'Intended Audience :: Developers',
    'License :: OSI Approved :: GNU Affero General Public License v3',
    'Natural Language :: English',
    'Programming Language :: Python :: Implementation :: CPython',
    'Programming Language :: Python :: 3',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
    'Programming Language :: Python :: 3.14',
]
keywords = ['ccres_disdrometer_processing']
dependencies = [
    "click",
    "netCDF4",
    "xarray",
    "pandas",
    "numpy>=2",
    "requests",
    "matplotlib",
    "scipy",
    "pyarrow",
    "pytmatrix @ git+https://github.com/ltelab/pytmatrix-lte.git@v0.4.5",
    "toml",
]
# Dynamic for setuptools
dynamic = ["version"]

[project.license]
file = "LICENSE"

[project.urls]
homepage = "https://github.com/ACTRIS-CCRES/ccres_disdrometer_processing"
documentation = "https://ccres-disdrometer-processing.readthedocs.io/en/latest/?version=latest"
repository = "https://github.com/ACTRIS-CCRES/ccres_disdrometer_processing"
changelog = "https://github.com/ACTRIS-CCRES/ccres_disdrometer_processing/blob/main/CHANGELOG.md"
"Bug Tracker" = "https://github.com/ACTRIS-CCRES/ccres_disdrometer_processing/issues"

[project.optional-dependencies]
dev = [
    "ccres_disdrometer_processing",
    # Pytest
    "pytest>=6.1.1",
    "pytest-cov>=2.10.1",
    "pytest-mock>=3.6.1",
    "coverage>=5.3",
    "requests",

    # Tox
    "tox",

    # Pre-commit
    "pre-commit",

    # Commitizen
    "commitizen>=4.18.0",
    # Formatting
    "ruff",

    # Typing
    "mypy",
]

docs = [
    "ablog",
    "numpydoc",
    "myst-nb",
    "sphinx",
    "sphinx-autobuild",
    "sphinx-book-theme",
    "sphinx-design",
    "sphinx-examples",
    "sphinx-copybutton",
    "sphinx-serve",
    "sphinx-tabs",
    "sphinx-togglebutton",
    "sphinx-thebe",
    "sphinxcontrib-bibtex",
    "sphinxcontrib-youtube",
    "sphinxext-opengraph",
]

[project.scripts]
ccres_disdrometer_processing = "ccres_disdrometer_processing.cli.cli:cli"

[tool.setuptools]
zip-safe = false

[tool.setuptools.packages.find]
include = ["ccres_disdrometer_processing", "ccres_disdrometer_processing.*"]

[tool.mypy]
explicit_package_bases = true
disallow_untyped_defs = true
ignore_missing_imports = true
exclude = ["/build/", "/venv/", "/tests/(cli|logger|run)/.py$", "/tests/.py$"]

[tool.docformatter]
recursive = true
blank = true
syntax = "numpy"

[tool.ruff]
exclude = ["docs"]

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "--cov=. --cov-config=pyproject.toml -vv --cov-report=html:htmlcov --cov-report=xml:coverage.xml --cov-report term"
testpaths = ["tests"]
filterwarnings = [
    "ignore::RuntimeWarning",
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
    "default:::ccres_disdrometer_processing.*",
]

[tool.coverage.run]
branch = true
omit = ["ccres_disdrometer_processing/tests/*", "./tests/*", "setup.py"]

[tool.coverage.report]
# Regexes for lines to exclude from consideration
exclude_also = [
    # Don't complain about missing debug-only code:
    "def __repr__",
    "if self\\.debug",

    # Don't complain if tests don't hit defensive assertion code:
    "raise AssertionError",
    "raise NotImplementedError",

    # Don't complain if non-runnable code isn't run:
    "if 0:",
    "if __name__ == .__main__.:",

    # Don't complain about abstract methods, they aren't run:
    "@(abc\\.)?abstractmethod",
]
ignore_errors = true

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.3.5"
changelog_start_rev = "v0.3.4"
tag_format = "v$version"
version_files = [
    "ccres_disdrometer_processing/__init__.py:version_str",
]
bump_message = "chore: bump version $current_version → $new_version"
retry_after_failure = true
annotated_tag = true
annotated_tag_message = "Release $new_version"
changelog_file = "CHANGELOG.md"
update_changelog_on_bump = true
pre_bump_hooks = []
post_bump_hooks = []
