# .readthedocs.yaml
# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2

# Plain Python, no conda: the conda environment could not be solved within
# Read the Docs' limits. gfortran is the only system dependency, needed to
# compile pytmatrix-lte's Fortran extension when the package is installed.
build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
  apt_packages:
    - gfortran

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs

# Build documentation in the docs/ directory with Sphinx
sphinx:
  configuration: docs/source/conf.py

# Optionally build your docs in additional formats such as PDF and ePub
formats:
  - pdf
  - epub
